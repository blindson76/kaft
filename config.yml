  home: C:\Users\ubozkurt\Downloads\kafka_2.13-4.1.0
  # data_dir: defaults to <temp>/kaft-kafka, one sub-directory per node
  cluster_id: MkU3OEVBNTcwNTJENDM2Qg
  members: 3
  heap: 512M
  # Wait for other controllers before forming the cluster, e.g. start Kafka
  # only once the Mongo replica set is established:
  # depends_on:
  #   - controller: mongo
  #     states: [monitoring]
time:
  # Keeps the system time through ntpd (Meinberg NTP), which kaft runs as a
  # standalone process with a configuration it writes itself. The NTP Windows
  # service must be stopped and disabled: it would hold UDP port 123. With
  # dry_run nothing on the machine is touched (ntpd, the clock): what would be
  # done is only logged. Remove it on the real servers; kaft then needs
  # administrator rights.
  dry_run: true
  # Per-node state: epoch, last time mode, time delta.
  state_file: C:\Users\ubozkurt\AppData\Local\Temp\kaft-time\{node}.json
  # External time servers (host or host:port). None reachable: internal mode.
  external: []
  # ntpd: C:\Program Files (x86)\NTP\bin\ntpd.exe
  # ntpq: defaults to ntpq.exe next to ntpd
  # ntp_conf: written by kaft; defaults to ntp-{node}\ntp.conf next to the state file
  # ntpd_args: []
  # source_hold_down: 10m  # a failed external source is left out this long
  # source_recover: 30s    # a lost source must answer this long to be used again
  # jump_threshold: 2s   # an external source moving this much...
  # jump_window: 10s     # ...within this time is no longer followed
  # Manual time (internal mode only), on any node:
  #   POST /time  {"time": "2026-11-15T12:00:00Z"}
  #   POST /event {"target": "time", "name": "time.set", "params": {"time": "2026-11-15T12:00:00Z"}}
