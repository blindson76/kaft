expected_bootstrap: 3
mongo:
  bin: C:\Users\ubozkurt\Downloads\mongodb-windows-x86_64-8.0.9\mongodb-win32-x86_64-windows-8.0.9\bin\cmongod.exe
  # data_dir: defaults to <temp>/kaft-mongo, one sub-directory per node
  replset: rs0
  # Replica set size. Formed once min_members mongo nodes report; grows into
  # spare mongo nodes up to max_members (at most 7; default: every mongo
  # node). Dead members are removed only while min_members remain.
  min_members: 3
  max_members: 4
  user: admin
  password: "123"
  args: ["--wiredTigerCacheSizeGB", "0.25"]
  # Forming the replica set waits this long for mongo nodes that join late,
  # so the most up-to-date data is not missed. Starts once min_members nodes
  # have reported; ends early once every mongo node has.
  decision_window: 30s
kafka:
  # Kafka 3.9+ (dynamic KRaft quorum). Run through java directly, not the .bat files.
  home: C:\Users\ubozkurt\Downloads\kafka_2.13-4.1.0
  # data_dir: defaults to <temp>/kaft-kafka, one sub-directory per node
  cluster_id: MkU3OEVBNTcwNTJENDM2Qg
  members: 3
  heap: 512M
  # Wait for other controllers before forming the cluster, e.g. start Kafka
  # only once the Mongo replica set is established:
  # depends_on:
  #   - controller: mongo
  #     states: [monitoring]
time:
  # Keeps the system time through Meinberg NTP. With dry_run nothing on the
  # machine is touched (ntp.conf, the NTP service, the clock): what would be
  # done is only logged. Remove it on the real servers; kaft then needs
  # administrator rights.
  dry_run: true
  # Per-node state: epoch, last time mode, time delta.
  state_file: C:\Users\ubozkurt\AppData\Local\Temp\kaft-time\{node}.json
  # External time servers (host or host:port). None reachable: internal mode.
  external: []
  # ntp_conf: C:\Program Files (x86)\NTP\etc\ntp.conf
  # service: NTP
  # jump_threshold: 2s   # an external source moving this much...
  # jump_window: 10s     # ...within this time is no longer followed
# Each node has roles (default: both):
#   server: runs raft and every enabled controller; counts for
#           expected_bootstrap and the quorum. Needs raft_addr.
#   worker: runs the workers of the controllers in `controllers` (default:
#           every enabled one) and carries out their orders. A worker-only
#           node has no raft; it talks to the leader over http_addr.
# Every node needs http_addr. Example of a worker-only node running only the
# time and mongo workers:
#   - id: node-5
#     roles: [worker]
#     controllers: [time, mongo]
#     http_addr: 127.0.0.1:8005
#     mongo_addr: 127.0.0.1:27005
nodes:
  - id: node-1
    raft_addr: 127.0.0.1:7001
    http_addr: 127.0.0.1:8001
    mongo_addr: 127.0.0.1:27001
    kafka_id: 1
    kafka_addr: 127.0.0.1:9091
    kafka_controller_addr: 127.0.0.1:9191
  - id: node-2
    raft_addr: 127.0.0.1:7002
    http_addr: 127.0.0.1:8002
    mongo_addr: 127.0.0.1:27002
    kafka_id: 2
