# Values may use environment variables: $VAR or ${VAR} (must be set),
# ${VAR:-default} (default when unset or empty), $$ for a literal $.
expected_bootstrap: 3
mongo:
  bin: C:\Users\ubozkurt\Downloads\mongodb-windows-x86_64-8.0.9\mongodb-win32-x86_64-windows-8.0.9\bin\mongod.exe
  # data_dir: defaults to <temp>/kaft-mongo, one sub-directory per node
  replset: rs0
  # Replica set size. Formed once min_members mongo nodes report; grows into
  # spare mongo nodes up to max_members (at most 7; default: every mongo
  # node). Dead members are removed only while min_members remain.
  min_members: 3
  max_members: 4
  user: admin
  password: "123"
  args: ["--wiredTigerCacheSizeGB", "0.25"]
  # Forming the replica set waits this long for mongo nodes that join late,
  # so the most up-to-date data is not missed. Starts once min_members nodes
  # have reported; ends early once every mongo node has.
  decision_window: 30s
kafka:
  # Kafka 3.9+ (dynamic KRaft quorum). Run through java directly, not the .bat files.
  home: C:\Users\ubozkurt\Downloads\kafka_2.13-4.1.0
  # data_dir: defaults to <temp>/kaft-kafka, one sub-directory per node
  cluster_id: MkU3OEVBNTcwNTJENDM2Qg
  members: 3
  heap: 512M
  # Wait for other controllers before forming the cluster, e.g. start Kafka
  # only once the Mongo replica set is established:
  # depends_on:
  #   - controller: mongo
  #     states: [monitoring]
time:
  # Keeps the system time through Meinberg NTP. With dry_run nothing on the
  # machine is touched (ntp.conf, the NTP service, the clock): what would be
  # done is only logged. Remove it on the real servers; kaft then needs
  # administrator rights.
  dry_run: true
  # Per-node state: epoch, last time mode, time delta.
  state_file: C:\Users\ubozkurt\AppData\Local\Temp\kaft-time\{node}.json
  # External time servers (host or host:port). None reachable: internal mode.
  external: []
  # ntp_conf: C:\Program Files (x86)\NTP\etc\ntp.conf
  # service: NTP
  # jump_threshold: 2s   # an external source moving this much...
  # jump_window: 10s     # ...within this time is no longer followed
# DNS server on every node. Names in the zone: <node id>.service,
# <controller><n>.service (n-th worker of that controller in node order,
# e.g. mongo1), <controller>.service (all its workers) and each node's
# dns_names. Other names go to the forwarders. Per node: dns_listen overrides
# listen, ip overrides the address the names resolve to.
# dns:
#   listen: ":53"
#   zone: service
#   ttl: 10s
#   forward: [8.8.8.8]
# Tasks: any command kept running as `instances` processes on worker nodes.
# Each task is a controller named after it (states: waiting, degraded,
# healthy), so it can wait for others and others can wait for it. A process
# that exits is moved to another node after 5s; the instances of a node that
# goes down are moved at once. Command, args, dir and env values may use
# {task}, {instance} (0, 1...) and {node}; the process also gets KAFT_TASK,
# KAFT_INSTANCE, KAFT_NODE and KAFT_GEN. Output: log_dir/<task>-<instance>.log.
# tasks:
#   - name: ingest
#     command: C:\services\ingest.exe
#     args: ["--id", "{task}-{instance}", "--kafka", "127.0.0.1:9091"]
#     env: {INGEST_NODE: "{node}"}
#     instances: 3
#     nodes: [node-2, node-3, node-4]  # default: every worker node
#     max_per_node: 1                  # default 0: no cap, still spread
#     # log_dir: C:\logs\{node}        # default: <temp>/kaft-tasks/<node>
#     # stop_timeout: 10s
#     depends_on:
#       - controller: kafka
#         states: [monitoring]
#   - name: report
#     command: C:\services\report.exe
#     depends_on: [{controller: ingest, states: [healthy]}]
#   # Roles: instances of one task that run with different arguments, e.g. a
#   # master and a slave, kept on different nodes by max_per_node: 1. A role's
#   # args come after the task's, its env overrides the task's; {role} and
#   # {replica} (number within the role) are available. {host:R} / {node:R}
#   # is where role R's instance runs (R must have count 1): an instance using
#   # it starts only once R runs, and is restarted with the new value when R
#   # moves to another node.
#   - name: cache
#     command: C:\redis\redis-server.exe
#     args: ["--port", "6379"]
#     max_per_node: 1
#     roles:
#       - name: master
#       - name: slave
#         count: 1
#         args: ["--replicaof", "{host:master}", "6379"]
# Each node has roles (default: both). Every node runs raft and keeps a
# replica of the cluster state:
#   server: a raft voter; counts for expected_bootstrap and the quorum, and
#           can become leader.
#   worker: runs the workers of the controllers in `controllers` (default:
#           every enabled one) and carries out their orders. A worker-only
#           node is a raft non-voter: it follows the log but has no vote.
# Every node needs raft_addr and http_addr. Example of a worker-only node
# running only the time and mongo workers:
#   - id: node-5
#     roles: [worker]
#     controllers: [time, mongo]
#     raft_addr: 127.0.0.1:7005
#     http_addr: 127.0.0.1:8005
#     mongo_addr: 127.0.0.1:27005
